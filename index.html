<!DOCTYPE html>
<html lang="ru" data-theme="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маркировка ЧЗ — ДН.РУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f8f9; --surface:#ffffff; --ink:#1f2933; --muted:#5d6774; --line:#e2e6eb; --band:#fbfcfc; --arrow:#7a8494; --hi:#1f2933;
  --sup:#55657a; --sup-t:#eef1f5; --sklad:#5f6b7a; --sklad-t:#f2f3f5; --sun:#d96a00; --sun-t:#fef2e7;
  --sbis:#1a63c6; --sbis-t:#ebf2fc; --c1:#2e7d32; --c1-t:#eef6ee; --c1-a:#dff0e0; --cz:#c62828; --cz-t:#fcefee;
  --warn:#a86a00; --warn-b:#f0b429; --warn-t:#fff8e1; --info:#0b6e75; --info-b:#0e8a94; --info-t:#e3f4f6;
  --ask:#7b4bb7; --ask-t:#f3eefb; --ok:#2e7d32; --ok-b:#4caf50; --ok-t:#e8f5e9;
  --d-head:#4352c4; --d-head-t:#eceefb; --d-acc:#0b7d86; --d-acc-t:#e2f3f5; --d-eng:#a35f00; --d-eng-t:#fcf0de;
  --d-adm:#7b4bb7; --d-adm-t:#f3eefb; --d-wh:#55657a; --d-wh-t:#eef1f5; --d-dev:#b8336a; --d-dev-t:#fbeaf1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#13161b; --surface:#1b1f26; --ink:#e6e9ee; --muted:#9aa3b0; --line:#2c323b; --band:#171a20; --arrow:#7f8999; --hi:#f2f4f7;
    --sup:#a4b2c4; --sup-t:#222832; --sklad:#a2acb9; --sklad-t:#22262d; --sun:#ff9b45; --sun-t:#2e2219;
    --sbis:#78acff; --sbis-t:#1a2537; --c1:#74c278; --c1-t:#1a281c; --c1-a:#22402a; --cz:#ff8080; --cz-t:#331e1f;
    --warn:#f3c159; --warn-b:#d89e22; --warn-t:#2c2516; --info:#6fd0d8; --info-b:#2aa3ad; --info-t:#142a2d;
    --ask:#c3a3f0; --ask-t:#261f33; --ok:#8fd694; --ok-b:#4caf50; --ok-t:#18291a;
    --d-head:#9aa5ff; --d-head-t:#1f2240; --d-acc:#6fd0d8; --d-acc-t:#142a2d; --d-eng:#f3b45e; --d-eng-t:#2e2416;
    --d-adm:#c3a3f0; --d-adm-t:#261f33; --d-wh:#a4b2c4; --d-wh-t:#222832; --d-dev:#f48fb8; --d-dev-t:#33192a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --ink:#e6e9ee; --muted:#9aa3b0; --line:#2c323b; --band:#171a20; --arrow:#7f8999; --hi:#f2f4f7;
  --sup:#a4b2c4; --sup-t:#222832; --sklad:#a2acb9; --sklad-t:#22262d; --sun:#ff9b45; --sun-t:#2e2219;
  --sbis:#78acff; --sbis-t:#1a2537; --c1:#74c278; --c1-t:#1a281c; --c1-a:#22402a; --cz:#ff8080; --cz-t:#331e1f;
  --warn:#f3c159; --warn-b:#d89e22; --warn-t:#2c2516; --info:#6fd0d8; --info-b:#2aa3ad; --info-t:#142a2d;
  --ask:#c3a3f0; --ask-t:#261f33; --ok:#8fd694; --ok-b:#4caf50; --ok-t:#18291a;
  --d-head:#9aa5ff; --d-head-t:#1f2240; --d-acc:#6fd0d8; --d-acc-t:#142a2d; --d-eng:#f3b45e; --d-eng-t:#2e2416;
  --d-adm:#c3a3f0; --d-adm-t:#261f33; --d-wh:#a4b2c4; --d-wh-t:#222832; --d-dev:#f48fb8; --d-dev-t:#33192a;
  color-scheme: dark;
}
:root[data-theme="soft"]{
  --bg:#efede7; --surface:#faf8f3; --ink:#2d2c29; --muted:#67635b; --line:#e0dbd0; --band:#f5f2eb; --arrow:#857f74; --hi:#2d2c29;
  --sup-t:#eeece6; --sklad-t:#efede7; --sun-t:#f9eedf; --sbis-t:#e9eef3; --c1-t:#ecf1e6; --c1-a:#dfe9d6; --cz-t:#f6e9e5;
  --warn-t:#f8efd8; --info-t:#e3efee; --ask-t:#efe9f1; --ok-t:#e5efdf;
  --d-head-t:#e9eaf2; --d-acc-t:#e3efee; --d-eng-t:#f6ecd9; --d-adm-t:#efe9f1; --d-wh-t:#ebeae5; --d-dev-t:#f5e6ea;
  color-scheme: light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sbis);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:12px 0 6px}
h1{font-size:21px;line-height:1.2;margin:0;font-weight:700}
.sub1{display:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools label{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--arrow)}
.btn[aria-pressed="true"]{background:var(--d-dev-t);border-color:var(--d-dev);color:var(--d-dev)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn-b);display:inline-block}
.sync.on i{background:var(--ok-b)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs .cnt{font-size:11.5px;background:var(--line);border-radius:999px;padding:1px 7px;margin-left:5px;color:var(--ink)}
.view[hidden]{display:none}

/* cards & grid */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.big{font-size:30px;font-weight:700;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.date{display:flex;gap:12px;align-items:baseline}
.date b{font-size:22px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok-b)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}

/* chips / tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1.5px solid;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.p-Блокер{background:var(--cz-t);color:var(--cz)}
.p-Высокий{background:var(--warn-t);color:var(--warn)}
.p-Средний{background:var(--info-t);color:var(--info)}
.p-Низкий{background:var(--line);color:var(--muted)}
.s-Готово{background:var(--ok-t);color:var(--ok)}
.s-Открыт{background:var(--line);color:var(--ink)}
.s-В\ работе{background:var(--sbis-t);color:var(--sbis)}

/* tables */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t tr.inv td{background:var(--band);font-weight:600}
table.t select,table.t input{padding:4px 6px;font-size:13px;max-width:100%}
table.t td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.done td{color:var(--muted)}
.empty{color:var(--muted);padding:14px}

/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 10px var(--pw,360px);gap:6px;align-items:start}
.mapgrid.collapsed aside.panel{display:none}
.split{align-self:stretch;min-height:200px;cursor:col-resize;border-radius:6px;position:relative}
.split::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:48px;margin-top:-24px;border-radius:3px;background:var(--line)}
.split:hover::after{background:var(--arrow)}
#canvas{resize:vertical}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.player{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.player .pos{color:var(--muted);font-size:13px;margin-left:auto}
.switch{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.switch button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
#canvas{height:calc(100vh - 230px);min-height:440px;overflow:auto;padding:12px;cursor:grab}
#canvas.grabbing{cursor:grabbing}
#canvas svg{display:block;margin:0 auto}
.canvas svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.legend[hidden]{display:none}
.sys{display:inline-flex;align-items:center;gap:6px}
.sys i{width:12px;height:12px;border-radius:4px;border:2px solid;display:inline-block}
.lg-line{display:inline-flex;align-items:center;gap:6px}
.lg-line svg{width:34px;height:10px}
.deptbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.deptbar[hidden]{display:none}
.dchip{display:flex;flex-direction:column;border:1.5px solid;border-radius:10px;padding:5px 10px;cursor:pointer;background:var(--surface);min-width:150px;text-align:left}
.dchip b{font-size:13px}
.dchip span{font-size:12px;color:var(--muted)}
.dchip[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor inset}

.band{fill:var(--band);stroke:var(--line)}
.bandbg{fill:var(--band)}
.bandlbl{fill:var(--muted);font-weight:600;font-size:14px}
.bandnum{fill:var(--line)}
.bandnumt{fill:var(--muted);font-weight:700;font-size:12px}
.edge{fill:none;stroke:var(--arrow);stroke-width:2;transition:opacity .2s}
.edge.dash{stroke-dasharray:6 5}
.edge.dot{stroke-dasharray:2 5;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.node{cursor:pointer;transition:opacity .2s}
.node rect.body{stroke-width:2}
.node:hover rect.body{stroke-width:3}
.node text{pointer-events:none}
.ttl{font-weight:600;font-size:15px;fill:var(--ink)}
.subt{font-size:12.5px;fill:var(--muted)}
.num{font-weight:700;font-size:13px;fill:#fff}
.chip rect{fill:var(--surface);stroke:var(--line)}
.chip text{font-size:12px;fill:var(--muted);font-style:italic}
.chip.strong text{font-style:normal;font-weight:600;fill:var(--sbis)}
.chip.strong rect{stroke:var(--sbis);stroke-opacity:.5}
.elabel rect{fill:var(--surface);stroke:var(--line)}
.elabel text{font-size:12px;fill:var(--muted);font-weight:500}
.ask circle{fill:var(--ask-t);stroke:var(--ask)}
.ask text{fill:var(--ask);font-weight:700;font-size:11px}
.okb circle{fill:var(--ok-t);stroke:var(--ok-b)}
.okb text{fill:var(--ok);font-weight:700;font-size:11px}
.packet{fill:var(--hi)}
.flag{stroke:var(--surface);stroke-width:2}
svg.sel .node:not(.on), svg.sel .edgewrap:not(.on), svg.sel .elabel:not(.on), svg.sel .chip:not(.on){opacity:.25}
.edgewrap.on .edge{stroke-width:3}
.node.on rect.body{stroke-width:3.5}
.node.cur .ring{opacity:1}
.ring{fill:none;stroke:var(--hi);stroke-width:1.5;stroke-dasharray:4 4;opacity:0}

aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto}
aside.panel h2{font-size:19px;line-height:1.25;margin:6px 0 8px}
aside.panel h3{font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 6px}
aside.panel p{margin:0 0 8px}
.box{border-radius:10px;padding:9px 12px;margin:8px 0;border-left:5px solid;font-size:14px}
.box b{display:block;margin-bottom:1px}
.box.warn{background:var(--warn-t);border-color:var(--warn-b);color:var(--warn)}
.box.info{background:var(--info-t);border-color:var(--info-b);color:var(--info)}
.box.ask{background:var(--ask-t);border-color:var(--ask);color:var(--ask)}
.box.ok{background:var(--ok-t);border-color:var(--ok-b);color:var(--ok)}
.link{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin:0 0 6px;cursor:pointer}
.link:hover{border-color:var(--arrow)}
.link .t{font-weight:600}
.link .s{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
ol.how{margin:0;padding-left:20px}
ol.how li{margin:3px 0}
.kind{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
table.cards{width:100%;border-collapse:collapse;font-size:13px}
table.cards td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
table.cards td:first-child{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}

/* how-to */
.steps{display:grid;gap:12px}
.stepcard{display:grid;grid-template-columns:54px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stepcard .no{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.stepcard h3{margin:0 0 4px;font-size:16px}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 8px;cursor:pointer;font-size:12px}
.val{font-variant-numeric:tabular-nums}
.warnline{color:var(--warn);font-size:13px}

.hub svg{width:100%;height:auto;display:block}
.phase{border-left:5px solid var(--line);padding-left:12px}
.phase.now{border-color:var(--ok-b)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}


.grow{flex:1}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
.btn.danger,.copy.danger{color:var(--cz)}
.btn.danger:hover,.copy.danger:hover{border-color:var(--cz)}
.zoombar{display:inline-flex;align-items:center;gap:4px}
.zoombar #zoomLbl{min-width:42px;text-align:center}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin:0 0 14px}
.vt{font-size:20px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;display:flex;gap:8px;align-items:baseline}
.stat b{font-size:17px}
.stat span{font-size:12.5px;color:var(--muted)}
details.crow{border:1px solid var(--line);border-radius:9px;margin:5px 0;background:var(--bg)}
details.crow summary{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer;list-style:none;font-size:14px}
details.crow summary::-webkit-details-marker{display:none}
details.crow .cbody{padding:0 10px 8px 26px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
details.more>summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
details.card>summary{cursor:pointer}
.irow{margin:8px 0}
select.stsel{border-width:1.5px;border-radius:999px;padding:3px 8px}
tr.inv.closed td{background:var(--ok-t)}
.invcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sbis);border-radius:14px;padding:12px 14px;margin:0 0 16px;box-shadow:0 1px 0 var(--line)}
.invcard.closed{border-left-color:var(--ok-b);background:var(--ok-t)}
.invhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin:0 0 8px}
.invno{font-size:18px;font-weight:700}
.invcard .tblwrap{border-radius:10px}
.tblwrap{resize:vertical}
input.miss{border-color:var(--warn-b);background:var(--warn-t)}
td.acts{white-space:nowrap}
table.t textarea{font-size:13px;resize:vertical}
input.donebox{width:18px;height:18px;accent-color:var(--ok-b);cursor:pointer}
#aisvg text{pointer-events:none}


.wrap{max-width:1760px}
tr.chkrow td{transition:background .2s}
tr.chkrow.r-block td{background:color-mix(in srgb,var(--cz-t) 85%,transparent)}
tr.chkrow.r-high td{background:color-mix(in srgb,var(--warn-t) 80%,transparent)}
tr.chkrow.r-work td{background:color-mix(in srgb,var(--sbis-t) 85%,transparent)}
tr.chkrow.done td{background:color-mix(in srgb,var(--line) 55%,transparent)}
tr.chkrow.r-block td:first-child{box-shadow:inset 4px 0 0 var(--cz)}
tr.chkrow.r-high td:first-child{box-shadow:inset 4px 0 0 var(--warn-b)}
tr.chkrow.r-work td:first-child{box-shadow:inset 4px 0 0 var(--sbis)}
tr.chkrow.done td:first-child{box-shadow:inset 4px 0 0 var(--arrow)}
tr.chkrow.done td,tr.chkrow.done textarea,tr.chkrow.done input[type=text],tr.chkrow.done b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)!important}
tr.chkrow.done select{opacity:.55}
tr.chkrow.done input::placeholder,tr.chkrow.done textarea::placeholder{color:transparent}
tr.chkrow textarea,tr.chkrow input[type=text]{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.tblhint .lg{display:inline-block;padding:1px 8px;border-radius:6px;margin-right:6px;font-weight:600}
.tblhint .lg.r-block{background:var(--cz-t);color:var(--cz)}
.tblhint .lg.r-high{background:var(--warn-t);color:var(--warn)}
.tblhint .lg.r-work{background:var(--sbis-t);color:var(--sbis)}
.tblhint .lg.done{background:var(--line);color:var(--muted);text-decoration:line-through}

table.t.fit{table-layout:fixed;width:100%}
table.t.fit th{white-space:normal;line-height:1.25;padding:7px 5px;vertical-align:bottom}
table.t.fit td{padding:5px 4px;overflow:hidden}
table.t.fit input,table.t.fit textarea,table.t.fit select{width:100%!important;max-width:100%;min-width:0;box-sizing:border-box;padding:4px 5px;font-size:12.5px}
table.t.fit select.stsel{padding:3px 4px}
table.t.fit td.acts{white-space:normal}
table.t.fit td.acts .copy{padding:1px 5px;margin:1px 0}
.fitwrap{overflow-x:hidden}
table.t.fixed{table-layout:fixed}
table.t.fixed td{overflow:hidden}

async function initCaps(){
  if(!(window.claude&&typeof window.claude.use==="function")) return;
  try{dlCap=await window.claude.use("downloads")}catch(e){dlCap=null}
  let db=null;try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db) return;
  dbCol=db.collection("state");
  const timer=setTimeout(()=>{},10000);
  dbCol.onSnapshot(snap=>{
    clearTimeout(timer);
    const next={};snap.docs.forEach(d=>{const v=d.data();if(v)next[d.id]=v});
    for(const k in OVR) if(!(k in next) && pending.has(k)) next[k]=OVR[k];
    OVR=next;saveLocal();
    const s=$("#sync");s.classList.add("on");s.querySelector("span").textContent="Общие данные для всех";
    rerender();
  },()=>{clearTimeout(timer)});
}
async function saveFile(name,data,mime){
  if(dlCap){
    try{await dlCap.save({filename:name,data})}catch(e){if(!e||e.code!=="declined")toast("Файл не сохранён")}
    return;
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

function edgeGeom(A,B){
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const tA=Math.min(Math.abs(ux)>1e-6?(A.w/2+4)/Math.abs(ux):1e9,Math.abs(uy)>1e-6?(A.h/2+4)/Math.abs(uy):1e9);
  const tB=Math.min(Math.abs(ux)>1e-6?(B.w/2+8)/Math.abs(ux):1e9,Math.abs(uy)>1e-6?(B.h/2+8)/Math.abs(uy):1e9);
  const sx=A.x+ux*tA,sy=A.y+uy*tA,ex=B.x-ux*tB,ey=B.y-uy*tB,cx=(sx+ex)/2-uy*40,cy=(sy+ey)/2+ux*40;
  return {d:`M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`,lx:Math.round(.25*sx+.5*cx+.25*ex),ly:Math.round(.25*sy+.5*cy+.25*ey)};
}

function sets(){
  const W=new Set(),E=new Set(),N=new Set();
  if(sel.step){W.add(sel.step);const s=ST[sel.step];s.edges.forEach(e=>{E.add(e);N.add(TE[e].from);N.add(TE[e].to)});(s.nodes||[]).forEach(n=>N.add(n))}
  else if(sel.edge){const e=TE[sel.edge];E.add(sel.edge);N.add(e.from);N.add(e.to);e.steps.forEach(x=>W.add(x))}
  else if(sel.node){N.add(sel.node);for(const id in TE){const e=TE[id];if(e.from===sel.node||e.to===sel.node){E.add(id);N.add(e.from);N.add(e.to);e.steps.forEach(x=>W.add(x))}}
    for(const id in ST)if((ST[id].nodes||[]).includes(sel.node))W.add(id)}
  else if(sel.dept){ORD.forEach(id=>{if(stepDept(id)===sel.dept)W.add(id)})}
  return {W,E,N};
}
function highlight(){
  const any=!!(sel.step||sel.edge||sel.node||sel.dept);const {W,E,N}=sets();
  ["wf","resp"].forEach(k=>{const F=FLOW[k];if(!F)return;F.svg.classList.toggle("sel",any);
    for(const id in F.nodes){F.nodes[id].classList.toggle("on",W.has(id));F.nodes[id].classList.toggle("cur",sel.step===id)}
    F.edges.forEach(({g,p,e})=>{const on=W.has(e.f)&&W.has(e.t);g.classList.toggle("on",on);p.setAttribute("marker-end",`url(#${F.P}${on?"on":"a"})`)});
    F.chips.forEach(c=>c.classList.toggle("on",c.dataset.rel.split(" ").filter(r=>W.has(r)).length>=2))});
  tech.classList.toggle("sel",any);
  for(const id in tNodeEls){tNodeEls[id].classList.toggle("on",N.has(id));tNodeEls[id].classList.toggle("cur",sel.node===id)}
  for(const id in tEdgeEls){const on=E.has(id);tEdgeEls[id].g.classList.toggle("on",on);tLabelEls[id].classList.toggle("on",on);tEdgeEls[id].p.setAttribute("marker-end",on?"url(#ton)":"url(#ta)")}
  startPackets([...E]);
}
let raf=null;
function startPackets(ids){
  if(!packets)return;packets.innerHTML="";cancelAnimationFrame(raf);
  if(reduce||!ids.length||layer!=="tech"||tab!=="map")return;
  const items=ids.map(id=>{const p=tEdgeEls[id].p;return {p,len:p.getTotalLength(),c:el("circle",{class:"packet",r:5},packets)}});
  const t0=performance.now();
  const tick=now=>{const t=((now-t0)/1600)%1;items.forEach(it=>{const pt=it.p.getPointAtLength(t*it.len);it.c.setAttribute("cx",pt.x);it.c.setAttribute("cy",pt.y)});raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
}

const invF={inv:"",type:"",card:"",codes:"",q:"",closed:true};
const COLS=[["art","Артикул",9],["name","Наименование",17.5],["qty","Кол-во",4.5],["dims","Габариты В×Ш×Г, мм",10.5],["w","Вес, кг",7.5],["set","Набор",4.5],["gtin","GTIN",10],["card","Карточка",10],["codes","Коды",10],["code","Код маркировки",8],["comment","Комментарий",12]];
let lastInvRows=[];
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Скопировано")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg||"Скопировано")}catch(_){toast("Не удалось скопировать")}ta.remove()}}
function renderInv(){
  const ps=allPos(),INV=allInv(),FL=fieldsList();
  const cols=COLS.concat(FL.map(f=>["f_"+f.id,f.name,8,true]));
  const f=p=>(!invF.inv||p.inv===invF.inv)&&(!invF.type||((INV.find(i=>i.id===p.inv)||{}).type||"—")===invF.type)&&(!invF.card||p.card===invF.card)&&(!invF.codes||p.codes===invF.codes)&&(!invF.q||(p.art+" "+p.name+" "+p.gtin+" "+p.comment).toLowerCase().includes(invF.q.toLowerCase()));
  const opt=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
  const ncol=cols.length+1;
  lastInvRows=[];
  const head=`<thead><tr>${cols.map(([k,n,w])=>`<th data-w="${w}">${esc(n)} <button class="copy" data-cpcol="${k}" title="Копировать столбец этого счёта">⧉</button></th>`).join("")}<th data-w="4"></th></tr></thead>`;

    const st=invStatus(i),closed=st==="Закрыт";

    if(!vis.length&&(invF.q||invF.card||invF.codes||(invF.inv&&invF.inv!==i.id)))return;
    const sc=invScore(i,ps);
    let rows="";
    vis.forEach(p=>{lastInvRows.push(p);
      rows+=`<tr class="${closed||p.codes==="Не требуется"?"done":""}">${cols.map(([k,,w])=>{
        if(k==="card")return `<td>${stSel(`data-pos="${esc(p.id)}" data-f="card"`,CARD_ST,p.card)}</td>`;
        if(k==="codes")return `<td>${stSel(`data-pos="${esc(p.id)}" data-f="codes"`,CODE_ST,p.codes)}</td>`;
        if(k==="name")return `<td><textarea data-pos="${esc(p.id)}" data-f="name" rows="2">${esc(p.name)}</textarea></td>`;
        return `<td><input type="text" data-pos="${esc(p.id)}" data-f="${k}" value="${esc(p[k]??"")}" title="${esc(p[k]??"")}" ${k==="art"&&!p.art?'class="miss" placeholder="нет артикула"':""}></td>`}).join("")}
        <td class="acts"><button class="copy" data-cprow="${esc(p.id)}" title="Копировать строку">⧉</button><button class="copy danger" data-delpos="${esc(p.id)}" title="Удалить строку">✕</button></td></tr>`});
    blocks+=`<section class="invcard ${closed?"closed":""}" data-invblock="${esc(i.id)}">
      <div class="invhead"><div class="row"><span class="invno">№${esc(i.id)}</span>
        <select data-invf="type" data-inv="${esc(i.id)}">${["","обязательно","перекуп"].map(t=>`<option value="${t}" ${t===i.type?"selected":""}>${t||"тип —"}</option>`).join("")}</select>
        ${stSel(`data-invf="status" data-inv="${esc(i.id)}"`,INV_ST,st)}
        <span class="muted small">${pp.length} поз. · ${pp.reduce((s,p)=>s+(+p.qty||0),0)} шт.</span></div>
        <div class="row"><span class="bar" style="width:140px"><i style="width:${Math.round(sc*100)}%"></i></span><b class="small">${Math.round(sc*100)}%</b>
        <button class="btn sm" data-addpos="${esc(i.id)}">+ строка</button><button class="btn sm danger" data-delinv="${esc(i.id)}">✕ счёт</button></div></div>
      ${closed?`<div class="row" style="margin:0 0 8px"><b class="small" style="color:var(--ok)">Причина закрытия</b><input type="text" data-invf="reason" data-inv="${esc(i.id)}" value="${esc(invReason(i))}" style="flex:1"></div>`:""}
      <input type="text" data-invf="note" data-inv="${esc(i.id)}" value="${esc(invNote(i))}" placeholder="Комментарий к счёту" style="width:100%;margin-bottom:8px">
      <div class="tblwrap fitwrap"><table class="t fit">${head}<tbody>${rows||`<tr><td colspan="${cols.length+1}" class="empty">Нет строк — нажмите «+ строка».</td></tr>`}</tbody></table></div></section>`;
  });
  const cnt=(arr,key)=>arr.map(s=>`<span class="pill" style="${stStyle(s)}">${esc(s)}: ${ps.filter(p=>p[key]===s).length}</span>`).join(" ");
  $("#v-inv").innerHTML=viewHead("Счета",`Таблица счетов от ${TODAY_LABEL}`)+`
   <div class="card" style="margin-bottom:12px"><div class="row small"><b>Карточки</b> ${cnt(CARD_ST.slice(1),"card")}</div><div class="row small" style="margin-top:6px"><b>Коды</b> ${cnt(CODE_ST.slice(1),"codes")}</div>
   <div class="row" style="margin-top:10px"><input type="text" id="newInv" placeholder="№ нового счёта" style="width:150px"><button class="btn primary" id="addInv">+ Счёт</button>
     <span style="width:14px"></span><input type="text" id="newField" placeholder="Новое поле (столбец)" style="width:190px"><button class="btn" id="addField">+ Поле</button>
     ${FL.map(fl=>`<span class="tag" style="color:var(--muted);border-color:var(--line)">${esc(fl.name)} <button class="copy" data-delfield="${esc(fl.id)}" title="Удалить поле">✕</button></span>`).join("")}</div></div>
   <div class="filters">
    <select data-if="inv"><option value="">все счета</option>${INV.map(i=>`<option value="${esc(i.id)}" ${invF.inv===i.id?"selected":""}>№${esc(i.id)}</option>`).join("")}</select>
    <select data-if="type"><option value="">любой тип</option>${["обязательно","перекуп","—"].map(t=>`<option ${invF.type===t?"selected":""}>${t}</option>`).join("")}</select>
    <select data-if="card"><option value="">карточка: любая</option>${opt(CARD_ST,invF.card)}</select>
    <select data-if="codes"><option value="">коды: любые</option>${opt(CODE_ST,invF.codes)}</select>
    <input type="search" data-if="q" value="${esc(invF.q)}" placeholder="Поиск: артикул, название, GTIN">
    <label class="small"><input type="checkbox" id="showClosed" ${invF.closed?"checked":""}> закрытые счета</label>
    <button class="btn" id="invCsv">CSV</button>
   </div>
   <p class="tblhint">Ширина колонки — тяните правый край заголовка, высота строки — нижний край строки. Двойной клик — вернуть по содержимому.</p>
   ${blocks||`<div class="card empty">Ничего не найдено — сбросьте фильтры.</div>`}`;
  const V=$("#v-inv");bindReport(V);
  V.querySelectorAll("[data-if]").forEach(x=>{x.oninput=x.onchange=()=>{invF[x.dataset.if]=x.value;if(x.tagName==="SELECT")renderInv()};if(x.type==="search"){x.onkeyup=e=>{if(e.key==="Enter")renderInv()};x.onblur=()=>renderInv()}});
  $("#showClosed").onchange=e=>{invF.closed=e.target.checked;renderInv()};
  V.querySelectorAll("[data-pos]").forEach(x=>x.onchange=()=>{save("pos-"+x.dataset.pos,{[x.dataset.f]:x.dataset.f==="qty"?(+x.value||0):x.value});if(x.tagName==="SELECT")renderInv();toast("Сохранено")});
  V.querySelectorAll("[data-invf]").forEach(x=>x.onchange=()=>{save("inv-"+x.dataset.inv,{[x.dataset.invf]:x.value});if(x.tagName==="SELECT")renderInv();toast("Сохранено")});
  V.querySelectorAll("[data-addpos]").forEach(b=>b.onclick=()=>{const k="posx-"+uid();save(k,{inv:b.dataset.addpos,name:"Новая позиция",qty:1,created:Date.now()});renderInv();toast("Строка добавлена")});
  V.querySelectorAll("[data-delpos]").forEach(b=>b.onclick=()=>{if(!confirm("Удалить строку целиком?"))return;save("pos-"+b.dataset.delpos,{deleted:true});renderInv();toast("Строка удалена")});
  V.querySelectorAll("[data-cprow]").forEach(b=>b.onclick=()=>{const p=allPos().find(x=>x.id===b.dataset.cprow);copyText(cols.map(([k])=>String(p[k]??"")).join("\t"),"Строка скопирована")});
  V.querySelectorAll("[data-cpcol]").forEach(b=>b.onclick=()=>{const k=b.dataset.cpcol,inv=b.closest("[data-invblock]").dataset.invblock;const rr=lastInvRows.filter(p=>p.inv===inv);copyText(rr.map(p=>String(p[k]??"")).join("\n"),"Столбец скопирован: "+rr.length+" строк")});
  V.querySelectorAll("[data-delinv]").forEach(b=>b.onclick=()=>{if(!confirm("Удалить счёт №"+b.dataset.delinv+" со всеми строками?"))return;save("inv-"+b.dataset.delinv,{deleted:true});renderInv();toast("Счёт удалён")});
  V.querySelectorAll("[data-delfield]").forEach(b=>b.onclick=()=>{if(!confirm("Удалить поле? Значения скроются."))return;save("fields",{list:fieldsList().filter(x=>x.id!==b.dataset.delfield)});renderInv()});

    save("inv-"+no,{deleted:false});if(!INVOICES.some(i=>i.id===no))save("invx-"+no,{type:"",created:Date.now()});
    save("posx-"+uid(),{inv:no,name:"Новая позиция",qty:1,created:Date.now()});renderInv();toast("Счёт добавлен")};
  $("#addField").onclick=()=>{const n=($("#newField").value||"").trim();if(!n){toast("Введите название поля");return}save("fields",{list:fieldsList().concat([{id:uid(),name:n}])});renderInv();toast("Поле добавлено")};
  $("#invCsv").onclick=()=>saveFile("Счета_маркировка.csv",toCSV(invAOA()),"text/csv");
  if(typeof applyTableSizes==="function")applyTableSizes();
}
function invAOA(){const FL=fieldsList(),INV=allInv();return [["Счёт","Тип","Статус счёта","Причина закрытия","Артикул","Наименование","Кол-во","Габариты В×Ш×Г, мм","Вес, кг","Набор","GTIN","Статус карточки","Статус кодов","Код маркировки","Комментарий"].concat(FL.map(f=>f.name),["Готовность счёта"])]

      </tbody></table></div></div>
  </div>

const chkF={dept:role,cat:"",prio:"",status:"",q:""};

  const vis=cs.filter(f).sort((a,b)=>(a.status==="Готово")-(b.status==="Готово")||PRIO_ORD[a.prio]-PRIO_ORD[b.prio]);
  const o=(arr,v,lab)=>arr.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${esc(lab?lab(x):x)}</option>`).join("");
  const nd=cs.filter(c=>c.status==="Готово").length;
  $("#v-chk").innerHTML=viewHead("Чек-лист",`Выполнено ${nd} из ${cs.length}`,`<button class="btn primary" id="addChk">+ Строка</button>`)+`

  V.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{chkF.q=b.dataset.chk;chkF.status="";chkF.dept="";go("chk")});
  $("#aiNext").onclick=()=>{aiIdx=Math.min(AIEDGES.length-1,aiIdx+1);aiSel=AIEDGES[aiIdx].id;renderAI()};
  $("#aiPrev").onclick=()=>{aiIdx=Math.max(0,aiIdx-1);aiSel=AIEDGES[aiIdx].id;renderAI()};
  $("#aiReset").onclick=()=>{aiIdx=-1;aiSel=null;renderAI()};
  const svg=$("#aisvg");svg.style.width="100%";svg.style.height="auto";
  cancelAnimationFrame(aiRaf);
  if(e&&!reduce){const p=svg.querySelector(`.aiedge[data-ae="${e.id}"] path`);const len=p.getTotalLength();const c=el("circle",{r:6,class:"packet"},$("#aipk"));const t0=performance.now();
    const tick=now=>{if(!document.body.contains(c))return;const pt=p.getPointAtLength(((now-t0)/1500%1)*len);c.setAttribute("cx",pt.x);c.setAttribute("cy",pt.y);aiRaf=requestAnimationFrame(tick)};aiRaf=requestAnimationFrame(tick)}
}
function aiAOA(){return [["Шаг","Откуда","Куда","Что передаётся","Как сейчас","Потом (API)","Проверяет человек"]].concat(AIEDGES.map((e,i)=>[i+1,AINODES[e.f].t,AINODES[e.t].t,e.l,e.d,e.api||"",e.hand?"да":""]))}

/* =================== ОТЧЁТЫ =================== */
function stepsAOA(){return [["Шаг","Название","Подпись","Система","Отдел","Описание","Как сделать","Заметки"]].concat(ORD.map(id=>{const s=ST[id];return [stepName(id),s.t,(s.sub||[]).join(" / "),SYS[s.sys]?SYS[s.sys].name:"",DEPT[stepDept(id)].name,s.desc||"",(s.how||[]).join(" | "),(s.notes||[]).map(n=>(KINDS_L[n[0]]||n[0])+": "+n[1]+" — "+n[2]).join(" | ")]}))}
function homeAOA(){const ps=allPos(),cs=allChk();return [["Показатель","Значение"],["Дата отчёта",new Date().toLocaleDateString("ru-RU")],["Позиций",ps.length],["Карточек опубликовано",ps.filter(p=>p.card==="Опубликована").length],["Открытых вопросов",cs.filter(c=>c.status!=="Готово").length],["Блокеров",cs.filter(c=>c.status!=="Готово"&&c.prio==="Блокер").length],["Выполнено",cs.filter(c=>c.status==="Готово").length]]
  .concat(DATES.map(d=>[d.d.split("-").reverse().join("."),d.t]))}
function invSumAOA(){const ps=allPos();return [["Счёт","Тип","Статус","Причина","Позиций","Готовность"]].concat(allInv().map(i=>[i.id,i.type,invStatus(i),invReason(i),ps.filter(p=>p.inv===i.id).length,Math.round(invScore(i,ps)*100)+"%"]))}
function cardIntAOA(){return [["Поле НК","Значение / правило","Откуда в Nova","Заполнение","Проверка до отправки","Кто"]].concat(CARD_FIELDS.map(f=>{const I=CARD_INT[f.k]||{};return [f.f,f.val,I.nova||"",I.auto||"",I.check||"",DEPT[f.who].name]}))}
function planAOA(){return [["Этап","Когда","Что","Вопросы чек-листа"]].concat(PHASES.map(p=>[p.n+". "+p.t,p.when,p.items.join("; "),p.chk.join(", ")]))}
function tzAOA(){return [["№","Задача","Суть"]].concat(TZ_TASKS)}
function report(t){const d=new Date().toISOString().slice(0,10);
  const R={map:[["Шаги",stepsAOA()],["Интеграции",techAOA()],["Ответственность",respAOA()]],home:[["Сводка",homeAOA()],["Счета",invSumAOA()],["Открытые вопросы",chkAOA().filter((r,i)=>i===0||r[8]!=="Готово")]],
    inv:[["Счета",invSumAOA()],["Позиции",invAOA()]],chk:[["Чек-лист",chkAOA()]],card:[["Поля для интеграции",cardIntAOA()],["Карточки",[["GTIN","Артикул","Наименование","Статус"]].concat(allPos().filter(p=>p.gtin).map(p=>[p.gtin,p.art,p.name,p.card]))]],
    ai:[["Обмен ЧЗ-AI",aiAOA()]],plan:[["Этапы",planAOA()],["Задачи ТЗ",tzAOA()]],how:[["Шаги",stepsAOA().filter((r,i)=>i===0||String(r[0]).includes("К"))]]};
  const N={map:"Карта",home:"Обзор",inv:"Счета",chk:"Чек-лист",card:"Карточка_ЧЗ",ai:"ЧЗ-AI",plan:"Nova",how:"Как_сделать"};
  xlsx(R[t]||R.map,`Отчёт_${N[t]||t}_${d}.xlsx`)}

/* =================== РЕГУЛИРУЕМЫЕ ОКНА =================== */
function initSplit(grid){
  if(!grid||grid.dataset.split)return;const key="dnru-pw-"+(grid.dataset.key||"map");grid.dataset.split=1;
  const w=+localStorage.getItem(key)||360;grid.style.setProperty("--pw",w+"px");if(w<40)grid.classList.add("collapsed");
  const sp=grid.querySelector(".split");if(!sp)return;
  sp.addEventListener("pointerdown",e=>{e.preventDefault();sp.setPointerCapture(e.pointerId);const r=grid.getBoundingClientRect();
    const mv=ev=>{let nw=Math.round(r.right-ev.clientX-4);if(nw<180){nw=0;grid.classList.add("collapsed")}else{nw=Math.min(Math.max(nw,240),Math.round(r.width*.7));grid.classList.remove("collapsed")}grid.style.setProperty("--pw",nw+"px");try{localStorage.setItem(key,nw)}catch(_){};if(tab==="map")applyZoom()};
    const up=()=>{sp.removeEventListener("pointermove",mv);sp.removeEventListener("pointerup",up)};sp.addEventListener("pointermove",mv);sp.addEventListener("pointerup",up)});
  sp.addEventListener("dblclick",()=>{const col=grid.classList.toggle("collapsed");const nw=col?0:360;grid.style.setProperty("--pw",nw+"px");try{localStorage.setItem(key,nw)}catch(_){};if(tab==="map")applyZoom()});
}
initSplit(document.querySelector("#v-map .mapgrid"));
if(window.ResizeObserver){const c=$("#canvas");new ResizeObserver(()=>{if(c.dataset.set&&c.style.height&&parseInt(c.style.height)!==+c.dataset.set&&!c.dataset.user){c.dataset.user=1;applyZoom()}else if(c.dataset.user)applyZoom()}).observe(c)}


/* =================== РАЗМЕРЫ СТРОК И КОЛОНОК =================== */
const TS_KEY="dnru-tsize2";
let TS={};try{TS=JSON.parse(localStorage.getItem(TS_KEY)||"{}")}catch(_){TS={}}
const tsSave=()=>{try{localStorage.setItem(TS_KEY,JSON.stringify(TS))}catch(_){}};
const tKey=tb=>tb.dataset.tkey||"";
const rowKey=tr=>{const x=tr.querySelector("[data-pos],[data-chk]");return x?(x.dataset.pos||x.dataset.chk):""};
function setRowH(tr,h){tr.style.height=h+"px";tr.querySelectorAll("textarea").forEach(t=>{t.style.height=Math.max(28,h-14)+"px"})}
function fitTable(tb){
  const ths=[...tb.querySelectorAll("thead th")];if(!ths.length)return;
  const s=TS[tKey(tb)];let pct=s&&s.pct&&s.pct.length===ths.length?s.pct:null;
  if(!pct){const w=ths.map(th=>+th.dataset.w||5),sum=w.reduce((x,y)=>x+y,0);pct=w.map(x=>x/sum*100)}
  ths.forEach((th,i)=>th.style.width=pct[i].toFixed(2)+"%");tb._pct=pct.slice();
}
function applyTableSizes(){
  const v=document.getElementById("v-"+tab);if(!v)return;
  v.querySelectorAll("table.t").forEach((tb,i)=>{
    if(!tb.dataset.tkey)tb.dataset.tkey=tab==="inv"?"inv":tab+"-"+i;
    if(tb.classList.contains("fit"))fitTable(tb);
    const s=TS[tKey(tb)];
    if(s&&s.rows)tb.querySelectorAll("tbody tr").forEach(tr=>{const h=s.rows[rowKey(tr)];if(h)setRowH(tr,h)});
  });
}
(()=>{
  let drag=null;const EDGE=6;
  const hit=e=>{const cell=e.target.closest&&e.target.closest("table.t th, table.t tbody td");if(!cell)return null;const r=cell.getBoundingClientRect();
    if(cell.tagName==="TH"&&cell.closest("table.fit")&&cell.nextElementSibling&&r.right-e.clientX<=EDGE&&r.right-e.clientX>=-3)return {type:"col",cell};
    if(cell.tagName==="TD"&&r.bottom-e.clientY<=EDGE&&r.bottom-e.clientY>=-2)return {type:"row",cell};
    return null};
  document.addEventListener("mousemove",e=>{if(drag)return;const h=hit(e);document.documentElement.classList.toggle("cur-col",!!h&&h.type==="col");document.documentElement.classList.toggle("cur-row",!!h&&h.type==="row")});
  document.addEventListener("pointerdown",e=>{if(e.button!==0)return;const h=hit(e);if(!h)return;e.preventDefault();e.stopPropagation();
    const tb=h.cell.closest("table");
    if(h.type==="col"){const ths=[...tb.querySelectorAll("thead th")];drag={type:"col",tb,i:ths.indexOf(h.cell),x:e.clientX,tw:tb.getBoundingClientRect().width,pct:(tb._pct||ths.map(th=>th.offsetWidth/tb.offsetWidth*100)).slice()}}
    else{const tr=h.cell.closest("tr");drag={type:"row",tb,tr,y:e.clientY,h:tr.offsetHeight}}
    document.documentElement.classList.add(drag.type==="col"?"cur-col":"cur-row")},true);
  window.addEventListener("pointermove",e=>{if(!drag)return;
    if(drag.type==="col"){const i=drag.i,p=drag.pct.slice(),pair=p[i]+p[i+1],dp=(e.clientX-drag.x)/drag.tw*100;
      p[i]=Math.max(2.5,Math.min(pair-2.5,p[i]+dp));p[i+1]=pair-p[i];drag.cur=p;
      const tables=tKey(drag.tb)==="inv"?document.querySelectorAll('table.t[data-tkey="inv"]'):[drag.tb];
      tables.forEach(t=>{const th=t.querySelectorAll("thead th");p.forEach((v,j)=>{if(th[j])th[j].style.width=v.toFixed(2)+"%"});t._pct=p.slice()})}
    else setRowH(drag.tr,Math.max(30,drag.h+e.clientY-drag.y))});
  window.addEventListener("pointerup",()=>{if(!drag)return;const k=tKey(drag.tb);TS[k]=TS[k]||{};
    if(drag.type==="col"){if(drag.cur)TS[k].pct=drag.cur}
    else{const rk=rowKey(drag.tr);if(rk){TS[k].rows=TS[k].rows||{};TS[k].rows[rk]=drag.tr.offsetHeight}}
    tsSave();drag=null;document.documentElement.classList.remove("cur-col","cur-row")});
  document.addEventListener("dblclick",e=>{const h=hit(e);if(!h)return;const tb=h.cell.closest("table"),k=tKey(tb);
    if(h.type==="col"){if(TS[k])delete TS[k].pct;tsSave();document.querySelectorAll(`table.t[data-tkey="${k}"]`).forEach(fitTable);toast("Ширина колонок — по умолчанию")}
    else{const tr=h.cell.closest("tr"),rk=rowKey(tr);if(TS[k]&&TS[k].rows)delete TS[k].rows[rk];tsSave();tr.style.height="";tr.querySelectorAll("textarea").forEach(t=>t.style.height="")}});
})();
/* =================== МАСШТАБ КАРТЫ =================== */
let zoom=1;
function curSvg(){return layer==="tech"?tech:layer==="resp"?$("#resp"):$("#wf")}
function applyZoom(){const svg=curSvg(),c=$("#canvas");if(!svg||!c||!c.clientWidth)return;if(!c.dataset.user){const top=c.getBoundingClientRect().top+window.scrollY;const h=Math.max(420,window.innerHeight-top-14);c.style.height=h+"px";c.dataset.set=h}const vb=svg.viewBox.baseVal;
  const fit=Math.min((c.clientWidth-24)/vb.width,(c.clientHeight-24)/vb.height),s=fit*zoom;
  svg.style.width=Math.round(vb.width*s)+"px";svg.style.height=Math.round(vb.height*s)+"px";const l=$("#zoomLbl");if(l)l.textContent=Math.round(zoom*100)+"%"}
function setZoom(z){const c=$("#canvas");const cx=(c.scrollLeft+c.clientWidth/2)/Math.max(1,c.scrollWidth),cy=(c.scrollTop+c.clientHeight/2)/Math.max(1,c.scrollHeight);
  zoom=Math.max(1,Math.min(8,z));applyZoom();c.scrollLeft=cx*c.scrollWidth-c.clientWidth/2;c.scrollTop=cy*c.scrollHeight-c.clientHeight/2}
(()=>{const c=$("#canvas");let d=null,moved=false;
  c.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;d={x:e.clientX,y:e.clientY,l:c.scrollLeft,t:c.scrollTop};moved=false});
  window.addEventListener("pointermove",e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!moved&&Math.abs(dx)+Math.abs(dy)>6){moved=true;c.classList.add("grabbing")}if(moved){c.scrollLeft=d.l-dx;c.scrollTop=d.t-dy}});
  window.addEventListener("pointerup",()=>{d=null;c.classList.remove("grabbing")});
  c.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  c.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.15:1/1.15))}},{passive:false});
  $("#zIn").onclick=()=>setZoom(zoom*1.4);$("#zOut").onclick=()=>setZoom(zoom/1.4);$("#zFit").onclick=()=>{zoom=1;delete c.dataset.user;applyZoom()};
  window.addEventListener("resize",()=>{if(tab==="map")applyZoom()});
})();

/* =================== ВЫГРУЗКИ =================== */
function toCSV(aoa){return "\ufeff"+aoa.map(r=>r.map(v=>{const s=String(v??"");return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(";")).join("\r\n")}
function respAOA(){return [["Шаг","Название","Система","Отдел","ФИО","Что делается","Открытых вопросов"]].concat(ORD.map(id=>{const s=ST[id],d=stepDept(id);return [stepName(id),s.t,SYS[s.sys].name,DEPT[d].name,deptPerson(d),s.desc,allChk().filter(c=>c.step===id&&c.status!=="Готово").length]}))}
function techAOA(){return [["Откуда","Куда","Способ","Данные","Когда","Риски и уточнения"]].concat(Object.values(TE).map(e=>[TN[e.from].t,TN[e.to].t,KIND[e.kind].name,e.data.join(", "),e.when,e.notes.map(n=>n[1]+": "+n[2]).join(" | ")]))}
function cardAOA(){return [["Поле","Обязательное","Что ставить","Откуда","Кто"]].concat(CARD_FIELDS.map(f=>[f.f,f.req?"да":"",f.val,f.src,DEPT[f.who].name]))}
function xlsx(sheets,name){
  if(!window.XLSX){toast("Excel недоступен без интернета — используйте CSV");return}
  const wb=XLSX.utils.book_new();
  sheets.forEach(([n,aoa])=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=aoa[0].map((_,i)=>({wch:Math.min(60,Math.max(8,...aoa.map(r=>String(r[i]??"").length))*0.9)}));XLSX.utils.book_append_sheet(wb,ws,n)});
  const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  saveFile(name,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
$("#xlsAll").onclick=()=>xlsx([["Сводка",homeAOA()],["Счета",invSumAOA()],["Позиции",invAOA()],["Чек-лист",chkAOA()],["Шаги",stepsAOA()],["Ответственность",respAOA()],["Интеграции",techAOA()],["ЧЗ-AI",aiAOA()],["Карточка ЧЗ",cardIntAOA()],["Nova",planAOA()]],"Маркировка_ЧЗ_ДНРУ.xlsx");

const eb=$("#editBtn");const setEB=()=>{eb.setAttribute("aria-pressed",editMode);eb.textContent=editMode?"✎ Правка: вкл":"✎ Правка"};setEB();
eb.onclick=()=>{editMode=!editMode;try{localStorage.setItem("dnru-edit",editMode?"1":"0")}catch(_){};setEB();if(layer==="resp"&&editMode)setLayer("workflow");renderPanel();toast(editMode?"Правка карты включена":"Правка карты выключена")};
$("#addStepTop").onclick=()=>{editMode=true;try{localStorage.setItem("dnru-edit","1")}catch(_){};setEB();if(layer!=="workflow")setLayer("workflow");sel={};renderPanel();$("#addStep").click()};
$("#mapReport").onclick=()=>report("map");
buildModel();renderFlow("wf","workflow");renderFlow("resp","resp");renderTech();renderLegends();
setLayer("workflow");
document.addEventListener("keydown",e=>{if(tab!=="map")return;const t=e.target;if(t&&t.closest&&t.closest("input,select,textarea"))return;
  if(e.key==="ArrowRight")goStep(playIdx+1);else if(e.key==="ArrowLeft"&&playIdx>0)goStep(playIdx-1);else if(e.key==="Escape"){playIdx=-1;select({})}});
